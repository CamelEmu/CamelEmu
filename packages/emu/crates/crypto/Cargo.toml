[package]
name = "emu_crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rsa = "0.9.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webpki-roots = "1.0.11"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
