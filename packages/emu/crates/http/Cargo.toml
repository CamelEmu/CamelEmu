[package]
name = "emu_http"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-openssl = { version = "0.10", features = ["client-legacy"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
openssl = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
tower-service = "0.3"
