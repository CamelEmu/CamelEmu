[package]
name = "session"
version = "0.1.0"
edition = "2024"

[dependencies]
emu_http = { path = "../http" }
emu_random = { path = "../random" }
flutter_rust_bridge = "=2.13.0"
libc = "0.2"
memory = { path = "../memory" }
serde_json = { version = "1", features = ["preserve_order"] }
ringbuf = "0.4"
thiserror = "2"
emu_crypto = { version = "0.1.0", path = "../crypto" }
emu_storage = { version = "0.1.0", path = "../storage" }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = []
link_core = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
oboe = "0.6"
