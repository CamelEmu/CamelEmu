[package]
name = "emu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]

[features]
default = []
link_core = ["session/link_core"]

[dependencies]
emu_crypto = { version = "0.1.0", path = "../crypto" }
emu_http = { version = "0.1.0", path = "../http" }
emu_random = { version = "0.1.0", path = "../random" }
emu_storage = { version = "0.1.0", path = "../storage" }
flutter_rust_bridge = "=2.13.0"
memory = { version = "0.1.0", path = "../memory" }
session = { version = "0.1.0", path = "../session" }
