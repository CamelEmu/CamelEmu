[package]
name = "azahar_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
flutter_rust_bridge = "=2.13.0"
libc = "0.2"
ringbuf = "0.4"
thiserror = "2"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = []
link_core = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
oboe = "0.6"
