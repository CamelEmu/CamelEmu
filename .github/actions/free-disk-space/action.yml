name: Free disk space
description: Removes the toolchains of the hosted runner that the builds do not use.

inputs:
  keep-android:
    description: Keep the preinstalled Android SDK.
    default: "false"
  android-ndk:
    description: The NDK version to keep when the Android SDK is kept.
    default: "28.2.13676358"

runs:
  using: composite
  steps:
    - name: Remove unused toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/local/.ghcup \
          /opt/ghc \
          /usr/local/share/boost \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/lib/node_modules \
          /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/go \
          /opt/hostedtoolcache/node \
          /opt/hostedtoolcache/PyPy \
          /opt/hostedtoolcache/Python \
          /opt/hostedtoolcache/Ruby \
          /opt/microsoft \
          /opt/google
        android_sdk=/usr/local/lib/android/sdk
        if [ "${{ inputs.keep-android }}" = "true" ]; then
          for ndk in "$android_sdk"/ndk/*; do
            if [ "$(basename "$ndk")" != "${{ inputs.android-ndk }}" ]; then
              sudo rm -rf "$ndk"
            fi
          done
          sudo rm -rf "$android_sdk/ndk-bundle" "$android_sdk/emulator" "$android_sdk/system-images"
        else
          sudo rm -rf /usr/local/lib/android
        fi
        sudo docker image prune --all --force
        df -h /
