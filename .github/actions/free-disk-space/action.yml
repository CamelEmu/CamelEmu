name: Free disk space
description: Removes the toolchains of the hosted runner that the builds do not use.

inputs:
  keep-android:
    description: Keep the preinstalled Android SDK.
    default: "false"

runs:
  using: composite
  steps:
    - name: Remove unused toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/local/.ghcup \
          /opt/ghc \
          /usr/local/share/boost \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/lib/node_modules \
          /opt/hostedtoolcache/CodeQL \
          /opt/microsoft \
          /opt/google
        if [ "${{ inputs.keep-android }}" != "true" ]; then
          sudo rm -rf /usr/local/lib/android
        fi
        sudo docker image prune --all --force
        df -h /
