name: azahar-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up the development shell
        uses: ./.github/actions/nix-develop
      - name: Resolve packages
        working-directory: apps/flutter
        run: nix develop ../.. --command flutter pub get
      - name: Generate code
        working-directory: apps/flutter
        run: nix develop ../.. --command dart run build_runner build -d
      - name: Analyze
        working-directory: apps/flutter
        run: nix develop ../.. --command flutter analyze
      - name: Report
        run: |
          {
            echo "## Flutter analysis"
            echo
            echo "| Flutter | Result |"
            echo "| --- | --- |"
            echo "| \`$(jq -r .flutter .fvmrc)\` | passed |"
          } >> "$GITHUB_STEP_SUMMARY"

  android-apk:
    needs: flutter-setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
            packages/emu/target
          key: ${{ runner.os }}-flutter-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flutter-android-
      - name: Set up the development shell
        uses: ./.github/actions/nix-develop
      - name: Add the Rust targets
        run: |
          nix develop --command rustup default stable
          nix develop --command rustup target add aarch64-linux-android x86_64-linux-android
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - name: Limit Gradle memory and parallelism
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m"
            echo "org.gradle.workers.max=1"
            echo "kotlin.daemon.jvmargs=-Xmx1G"
          } > ~/.gradle/gradle.properties
      - name: Build APK
        run: nix develop --command ./.ci/flutter-android.sh
      - name: Report
        run: |
          apk_path=$(find apps/flutter/build/app/outputs/flutter-apk -maxdepth 1 -name "*.apk" | head -n1)
          {
            echo "## Flutter Android APK"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`$(basename "$apk_path")\` | $(du -h "$apk_path" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/*.apk
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
            packages/emu/target
          key: ${{ runner.os }}-flutter-android-${{ github.run_id }}-${{ github.run_attempt }}

  linux:
    needs: flutter-setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            build
            packages/emu/target
            apps/flutter/build
          key: ${{ runner.os }}-flutter-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flutter-linux-
      - name: Set up the development shell
        uses: ./.github/actions/nix-develop
      - name: Build Linux app
        run: nix develop --command ./.ci/flutter-linux.sh
      - name: Report
        run: |
          bundle_dir=apps/flutter/build/linux/x64/release/bundle
          {
            echo "## Flutter Linux bundle"
            echo
            echo "| Directory | Size |"
            echo "| --- | --- |"
            echo "| \`bundle\` | $(du -sh "$bundle_dir" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux
          path: apps/flutter/build/linux/x64/release/bundle
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            build
            packages/emu/target
            apps/flutter/build
          key: ${{ runner.os }}-flutter-linux-${{ github.run_id }}-${{ github.run_attempt }}

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: flutter-linux
          path: apps/flutter/build/linux/x64/release/bundle
      - name: Load build image
        uses: ./.github/actions/docker-image
        with:
          image: bilelmoussaoui/flatpak-github-actions:gnome-47
      - name: Build
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            bilelmoussaoui/flatpak-github-actions:gnome-47 \
            ./.ci/flatpak.sh
      - name: Take ownership of the build output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Report
        run: |
          {
            echo "## Flatpak bundle"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`azahar.flatpak\` | $(du -h azahar.flatpak | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: azahar.flatpak

  deb:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: flutter-linux
          path: apps/flutter/build/linux/x64/release/bundle
      - name: Build
        run: ./.ci/deb.sh
      - name: Report
        run: |
          {
            echo "## Debian package"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in build/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb
