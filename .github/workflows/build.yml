name: azahar-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-setup:
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.fvm.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Dart package submodules
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init \
            apps/flutter/packages/babstrap_settings_screen \
            apps/flutter/packages/glass_bottom_navigation \
            packages/externals/flutter_liquid_glass
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - name: Resolve packages
        working-directory: apps/flutter
        run: flutter pub get
      - name: Generate code
        working-directory: apps/flutter
        run: dart run build_runner build -d
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze

  android-apk:
    needs: flutter-setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          keep-android: "true"
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
            packages/azahar_rust/target
          key: ${{ runner.os }}-flutter-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flutter-android-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.flutter-setup.outputs.flutter-version }}
          cache: true
      - name: Set up Rust
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install ccache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - name: Limit Gradle memory and parallelism
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m"
            echo "org.gradle.workers.max=1"
            echo "kotlin.daemon.jvmargs=-Xmx1G"
          } > ~/.gradle/gradle.properties
      - name: Build APK
        run: ./.ci/flutter-android.sh
      - name: Report
        run: |
          apk_path=$(find apps/flutter/build/app/outputs/flutter-apk -maxdepth 1 -name "*.apk" | head -n1)
          {
            echo "## Flutter Android APK"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`$(basename "$apk_path")\` | $(du -h "$apk_path" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/*.apk
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
            packages/azahar_rust/target
          key: ${{ runner.os }}-flutter-android-${{ github.run_id }}-${{ github.run_attempt }}

  linux:
    needs: flutter-setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            build
            packages/azahar_rust/target
            apps/flutter/build
          key: ${{ runner.os }}-flutter-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flutter-linux-
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.flutter-setup.outputs.flutter-version }}
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache ninja-build clang pkg-config \
            libgtk-3-dev libevdev-dev libasound2-dev liblzma-dev
      - name: Build Linux app
        run: ./.ci/flutter-linux.sh
      - name: Report
        run: |
          bundle_dir=apps/flutter/build/linux/x64/release/bundle
          {
            echo "## Flutter Linux bundle"
            echo
            echo "| Directory | Size |"
            echo "| --- | --- |"
            echo "| \`bundle\` | $(du -sh "$bundle_dir" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux
          path: apps/flutter/build/linux/x64/release/bundle
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            build
            packages/azahar_rust/target
            apps/flutter/build
          key: ${{ runner.os }}-flutter-linux-${{ github.run_id }}-${{ github.run_attempt }}

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Load build image
        uses: ./.github/actions/docker-image
        with:
          image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flatpak-
      - name: Build
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            bilelmoussaoui/flatpak-github-actions:kde-6.7 \
            ./.ci/flatpak.sh
      - name: Take ownership of the build output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Report
        run: |
          {
            echo "## Flatpak bundle"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`azahar.flatpak\` | $(du -h azahar.flatpak | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: azahar.flatpak
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ github.run_id }}-${{ github.run_attempt }}

  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Load build image
        uses: ./.github/actions/docker-image
        with:
          image: opensauce04/azahar-build-environment:latest
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-deb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-deb-
      - name: Build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e CCACHE_DIR -e CCACHE_COMPILERCHECK -e CCACHE_SLOPPINESS \
            -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            opensauce04/azahar-build-environment:latest \
            ./.ci/deb.sh
      - name: Report
        run: |
          {
            echo "## Debian package"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in build/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-deb-${{ github.run_id }}-${{ github.run_attempt }}
