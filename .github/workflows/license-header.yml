name: citra-license

on:
  pull_request:
    branches: [ main ]

jobs:
  license-header:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main branch
        run: git fetch origin main:main
      - name: Check license headers
        run: ./.ci/license-header.rb
