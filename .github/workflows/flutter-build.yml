name: azahar-flutter-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            packages/azahar_rust/target
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-flutter-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flutter-android-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
      - name: Set up Rust
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install ccache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
      - name: Build APK
        run: ./.ci/flutter-android.sh
      - name: Report
        run: |
          apk_path=$(find apps/flutter/build/app/outputs/flutter-apk -maxdepth 1 -name "*.apk" | head -n1)
          {
            echo "## Flutter Android APK"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`$(basename "$apk_path")\` | $(du -h "$apk_path" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azahar-flutter-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/*.apk
