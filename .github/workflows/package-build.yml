name: azahar-package-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: azahar.flatpak
          manifest-path: dist/flatpak/org.azahar_emu.Azahar.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Report
        run: |
          {
            echo "## Flatpak bundle"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            echo "| \`azahar.flatpak\` | $(du -h azahar.flatpak | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: azahar-flatpak
          path: azahar.flatpak

  deb:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-deb-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deb-
      - name: Build
        run: ./.ci/deb.sh
      - name: Report
        run: |
          {
            echo "## Debian package"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in build/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: azahar-deb
          path: build/*.deb
