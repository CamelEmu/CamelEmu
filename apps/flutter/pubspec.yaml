name: azahar
description: "Azahar"
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  azahar_for_flutter:
    path: ../../packages/native
  babstrap_settings_screen:
    path: packages/babstrap_settings_screen
  desktop_multi_window: ^0.3.1
  drift: ^2.35.0
  dynamic_color: ^1.9.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_joystick: ^0.2.2
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  gamepads: ^0.1.12
  glass_bottom_navigation:
    path: packages/glass_bottom_navigation
  go_router: ^18.0.1
  liquid_glass_renderer:
    path: ../../packages/externals/flutter_liquid_glass/packages/liquid_glass_renderer
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  sqlite3_flutter_libs: ^0.6.0+eol
  stack_trace: ^1.12.2
  universal_gamepad: ^1.5.8
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/azahar_logo.png
    - assets/images/no_icon.png
    - assets/images/no_icon_dark.png
    - assets/gamepad/
    - assets/icons/discord.svg
    - assets/icons/github.svg
    - assets/icons/linux.png
